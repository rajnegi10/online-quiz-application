<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or "Admin Command Center" }}</title>
<style>
:root{--bg:#070b14;--card:#0f1728;--card2:#111c30;--line:#22314b;--text:#edf4ff;--muted:#9eb0ca;--accent:#7c9cff;--good:#48d597;--danger:#ff6b7a;--warn:#ffc85a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#162447 0,#070b14 42%);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{font-size:24px;font-weight:900}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:13px;margin-top:4px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#121d31;color:var(--text);padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer}.btn:hover{border-color:#5d75a8}.primary{background:linear-gradient(135deg,#637ff8,#8a63f6);border:0}.danger{background:#351522;border-color:#633040;color:#ffb7c0}.good{background:#103128;border-color:#1e624f}.card{background:linear-gradient(180deg,rgba(17,28,48,.96),rgba(11,19,33,.96));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.grid{display:grid;gap:16px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.stat b{font-size:30px;display:block;margin:7px 0}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#182640;color:#c8d6ef;font-size:12px;font-weight:800}.ok{color:var(--good)}.bad{color:var(--danger)}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:12px;border-bottom:1px solid #1d2a40;text-align:left;vertical-align:top}.table th{color:#9fb2d0;font-size:12px;text-transform:uppercase}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}input,select,textarea{width:100%;background:#0a1220;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}textarea{min-height:110px;resize:vertical}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.filters .field{min-width:180px}.alert{padding:12px 14px;border-radius:12px;margin-bottom:14px;background:#241c0d;border:1px solid #5d4a22;color:#ffe1a0}.alert.err{background:#28131a;border-color:#5d2937;color:#ffb7c0}.hero{padding:24px;border-radius:22px;background:linear-gradient(135deg,#141f3a,#0c1424);border:1px solid #2a3d63;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:30px}.control{display:flex;justify-content:space-between;gap:12px;align-items:center}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.controlcard{padding:18px;border:1px solid var(--line);border-radius:16px;background:#0c1525;transition:.2s}.controlcard:hover{transform:translateY(-2px);border-color:#4c6493}.icon{font-size:28px}.small{font-size:12px}.center{text-align:center}@media(max-width:900px){.grid4,.grid3,.controls{grid-template-columns:repeat(2,1fr)}.grid2,.formgrid{grid-template-columns:1fr}}@media(max-width:600px){.grid4,.grid3,.controls{grid-template-columns:1fr}.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">⚡ ADMIN <span>COMMAND CENTER</span></div><div class="sub">Owner access · {{ admin_name }}</div></div>
<div class="actions"><a class="btn" href="{{ url_for('admin_dashboard') }}">⌂ Dashboard</a><a class="btn" href="{{ url_for('home') }}">Student Site</a><a class="btn danger" href="{{ url_for('admin_logout') }}">Logout</a></div></div>
{% block content %}{% endblock %}
</div></body></html>
